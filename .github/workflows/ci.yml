name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.yaml }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        yaml: [builtin]
        include:
          - os: ubuntu-latest
            python: "3.13"
            yaml: pyyaml       # the engine prefers PyYAML when importable; the configure test's PyYAML assertions need it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - if: matrix.yaml == 'pyyaml'
        run: python -m pip install pyyaml
      - name: pytest
        shell: bash
        run: python -m pytest -q -rs --junitxml=pytest-report.xml
      - name: failing tests as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest-report.xml").getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = ((bad.get("message") or "") + "\n" + (bad.text or ""))[-3000:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pyflakes
      - run: python -m pyflakes scripts/python tools tests
      - run: shellcheck scripts/bash/scopeguard.sh tools/e2e-speckit.sh
      - run: python tools/build.py --check

  launchers:
    name: launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: bash launcher reproduces the missed user story (expects exit 1)
        shell: bash
        working-directory: examples/missing-story
        run: |
          set +e
          bash ../../scripts/bash/scopeguard.sh plan; code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          bash ../../scripts/bash/scopeguard.sh plan --iteration 4; code=$?
          test "$code" -eq 3 || { echo "expected escalation exit 3, got $code"; exit 1; }
          test -f specs/001-team-board/scopeguard-escalation-plan.md
      - name: PowerShell launcher reproduces the missed user story (expects exit 1)
        shell: pwsh
        working-directory: examples/missing-story
        run: |
          & ../../scripts/powershell/scopeguard.ps1 plan
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          & ../../scripts/powershell/scopeguard.ps1 inventory --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "inventory failed with $LASTEXITCODE" }
          & ../../scripts/powershell/scopeguard.ps1 tasks --iteration 4
          if ($LASTEXITCODE -ne 3) { throw "expected escalation exit 3, got $LASTEXITCODE" }
          exit 0

  spec-kit:
    name: install into Spec Kit (${{ matrix.speckit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        speckit: ["specify-cli", "specify-cli==0.12.17"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "${{ matrix.speckit }}"
      - name: scopeGuard + preset in a fresh Spec Kit project
        run: bash tools/e2e-speckit.sh

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: run the action on the example (must fail)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          working-directory: examples/missing-story
      - name: the gate must have failed
        run: test "${{ steps.gate.outcome }}" = "failure"
      - name: report mode never fails
        uses: ./
        with:
          command: report
          working-directory: examples/missing-story
