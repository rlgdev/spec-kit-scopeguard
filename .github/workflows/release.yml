name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest && python -m pytest -q
      - name: build archives
        run: python tools/build.py --check-tag "${GITHUB_REF_NAME}"
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          PY
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/scopeguard.zip dist/scopeguard-preset.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/scopeguard.zip dist/scopeguard-preset.zip dist/SHA256SUMS \
              --title "scopeGuard $GITHUB_REF_NAME" --notes "$notes"
          fi
