schema_version: "1.0"

extension:
  id: scopeguard
  name: "scopeGuard"
  version: "0.4.0"
  description: "Deterministic scope gates that find and resolve user stories or requirements from spec.md dropped by plan or tasks, and escalate with a problem report when they cannot"
  author: "rlgdev"
  repository: https://github.com/rlgdev/spec-kit-scopeguard
  homepage: https://github.com/rlgdev/spec-kit-scopeguard
  license: MIT
  category: process
  effect: read-write

requires:
  # 0.12.17 is the first release that rewrites extension-local "scripts/..."
  # paths in command frontmatter to .specify/extensions/<id>/scripts/.
  speckit_version: ">=0.12.17"
  tools:
    - name: python
      version: ">=3.9"
      required: false
      description: "Runs the deterministic checker (standard library only). Without python on PATH the launchers use the Python bundled with specify-cli, or uv."

provides:
  commands:
    - name: speckit.scopeguard.inventory
      file: commands/speckit.scopeguard.inventory.md
      description: "List every user story and requirement ID in spec.md and state the scope contract for plan and tasks"
    - name: speckit.scopeguard.plan
      file: commands/speckit.scopeguard.plan.md
      description: "Gate: find spec items missing from plan.md and resolve them in the plan (autocorrect, then escalate)"
    - name: speckit.scopeguard.tasks
      file: commands/speckit.scopeguard.tasks.md
      description: "Gate: find in-scope spec items without tasks and add the tasks (autocorrect, then escalate)"
    - name: speckit.scopeguard.implement
      file: commands/speckit.scopeguard.implement.md
      description: "Gate: every task carrying an in-scope spec item is checked off"
    - name: speckit.scopeguard.report
      file: commands/speckit.scopeguard.report.md
      description: "Coverage matrix of every spec item across plan, tasks and implement"
    - name: speckit.scopeguard.compare
      file: commands/speckit.scopeguard.compare.md
      description: "Compare scope coverage of two feature directories, e.g. two lab runs of the same spec"
    - name: speckit.scopeguard.configure
      file: commands/speckit.scopeguard.configure.md
      description: "Apply scopeguard-config.yml: inline gates inside /speckit.plan and /speckit.tasks or hook commands, autocorrect iterations"

  config:
    - name: "scopeguard-config.yml"
      template: "config-template.yml"
      description: "scopeGuard settings: integration (inline, hooks or embedded), autocorrect on/off and iterations, gates, story key and traced ID prefixes, enforce/report mode"
      required: false

hooks:
  before_plan:
    command: speckit.scopeguard.inventory
    optional: false
    description: "(integration: hooks) Put the full scope contract in front of the planner"
  after_plan:
    command: speckit.scopeguard.plan
    optional: false
    description: "(integration: hooks) Resolve every user story or requirement plan.md left out, escalate after the autocorrect limit"
  before_tasks:
    command: speckit.scopeguard.inventory
    optional: false
    description: "(integration: hooks) Put the in-scope items in front of the task generator"
  after_tasks:
    command: speckit.scopeguard.tasks
    optional: false
    description: "(integration: hooks) Add tasks for every in-scope item without one, escalate after the autocorrect limit"
  after_implement:
    command: speckit.scopeguard.implement
    optional: true
    prompt: "Run the scopeGuard implement gate (every in-scope item's tasks checked off)?"
    description: "Report in-scope items whose tasks are still open"

tags:
  - "scope"
  - "traceability"
  - "coverage"
  - "quality-gate"
  - "requirements"
