schema_version: "1.0"

preset:
  id: "scopeguard-templates"
  name: "scopeGuard Templates"
  version: "0.3.0"
  description: "Makes the scopeGuard scope gate a mandatory step of /speckit.plan and /speckit.tasks and adds Scope Coverage tables to the plan and tasks templates (pairs with the scopeguard extension)"
  author: "rlgdev"
  repository: "https://github.com/rlgdev/spec-kit-scopeguard"
  license: "MIT"

requires:
  speckit_version: ">=0.12.17"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Adds the Scope Coverage table (one row per user story and requirement ID) to plan.md"
      strategy: "append"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Adds the Scope Coverage mapping (requirement ID -> task IDs) to tasks.md"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Wraps /speckit.plan with the mandatory scopeGuard scope inventory and scope gate (integration: inline)"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Wraps /speckit.tasks with the mandatory scopeGuard scope inventory and scope gate (integration: inline)"
      strategy: "wrap"

tags:
  - "scope"
  - "traceability"
  - "coverage"
  - "templates"
